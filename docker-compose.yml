services:
  ota-orchestrator:
    image: ota-orchestrator:latest
    restart: unless-stopped
    build:
      context: .
      dockerfile: ota-orchestrator/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      rollout-controller:
        condition: service_healthy
    env_file:
      - ./ota-orchestrator/.env
    environment:
      HTTP_SERVER_HOST: 0.0.0.0
      HTTP_SERVER_PORT: ${HTTP_SERVER_PORT:?}
      ROLLOUT_CONTROLLER_HOST: rollout-controller
      ROLLOUT_CONTROLLER_PORT: ${ROLLOUT_CONTROLLER_PORT:?}
      DB_HOST: postgres
      CACHE_HOST: redis
      BROKER_HOST: kafka
      BROKER_PORT: 9092
      DB_USER: ${POSTGRES_USER:?}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?}
      DB_NAME: ${POSTGRES_DB:?}
      DB_PORT: 5432
    ports:
      - "${OTA_ORCHESTRATOR_PORT:?}:${HTTP_SERVER_PORT:?}"
    healthcheck:
      test: [ "CMD", "/usr/bin/curl", "-f", "http://localhost:${HTTP_SERVER_PORT:?}/healthz" ]
      start_period: 5s
      interval: 30s
      timeout: 10s
      retries: 5

  rollout-controller:
    image: rollout-controller:latest
    restart: unless-stopped
    build:
      context: .
      dockerfile: rollout-controller/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    env_file:
      - ./rollout-controller/.env
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: ${ROLLOUT_CONTROLLER_PORT:?}
      CACHE_HOST: redis
      BROKER_HOST: kafka
      BROKER_PORT: 9092
    healthcheck:
      test: [ "CMD", "curl", "-f", "-X", "POST", "http://localhost:${ROLLOUT_CONTROLLER_PORT:?}/health.v1.HealthService/CheckHealth", "-H", "Content-Type: application/json", "-d", "{}" ]
      start_period: 5s
      interval: 30s
      timeout: 10s
      retries: 5

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      start_period: 5s
      interval: 30s
      timeout: 10s
      retries: 5

  migrate:
    image: migrate/migrate:v4.19.1
    profiles: [ "migrate" ]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations
    entrypoint:
      - migrate
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      start_period: 5s
      interval: 30s
      timeout: 10s
      retries: 5

  kafka:
    image: apache/kafka:4.3.1
    restart: unless-stopped
    environment:
      # KRaft mode
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # Listeners
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:${KAFKA_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # Topic defaults
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

      # Data
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: ${KAFKA_LOG_RETENTION_HOURS:-24}
    ports:
      - "${KAFKA_PORT}:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092" ]
      start_period: 10s
      interval: 30s
      timeout: 10s
      retries: 5

  kafka-init:
    image: apache/kafka:4.3.1
    profiles: [ "kafka-init" ]
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        set -e
        for topic in \
          "device.checkins" \
          "firmware.update-results" \
          "firmware.update-results.dlq" \
          "rollout.decisions" \
          "rollout.decisions.dlq"; do
          /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server kafka:9092 \
            --create --if-not-exists --topic "$$topic" \
            --partitions ${KAFKA_TOPIC_PARTITIONS:-3} \
            --replication-factor 1
        done

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    profiles: [ "kafka-ui" ]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "${KAFKA_UI_PORT}:8080"

volumes:
  pgdata:
  kafka-data:
