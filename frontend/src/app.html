<!doctype html>
<html lang="ru" class="dark">
	<head>
		<meta charset="utf-8" />
		<!-- Блокирующий внешний скрипт до таблицы стилей: ставит или снимает класс
		     `.dark` до первого кадра. Внешний, а не inline, поэтому под
		     `script-src 'self'` он проходит без хешей. Свой inline-бутстрап
		     SvelteKit хешует сам: см. kit.csp в svelte.config.js. -->
		<script src="/theme-init.js"></script>
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="dark light" />
		<meta name="robots" content="noindex, nofollow" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<!-- preload только тех начертаний, что реально нужны русскому интерфейсу:
		     кириллица обоих семейств; латина (цифры) добирается по unicode-range. -->
		<link
			rel="preload"
			href="/fonts/geist-cyrillic-wght-normal.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<link
			rel="preload"
			href="/fonts/geist-mono-cyrillic-wght-normal.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div class="contents">%sveltekit.body%</div>
	</body>
</html>
